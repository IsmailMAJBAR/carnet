<style>
:root { --fond: #f7f5f1; --surface: #fff; --texte: #1f1d1a; --doux: #5a554d; --bord: #d6d0c6; --accent: #b03a2e; --accent-texte: #fff; --ko: #9a3412; --focus: #1f5fbf; }
@media (prefers-color-scheme: dark) {
  :root { --fond: #151412; --surface: #1f1d1a; --texte: #eeeae3; --doux: #b8b1a6; --bord: #3d3933; --accent: #f08a77; --accent-texte: #1a0f0c; --ko: #f4a77a; --focus: #8ab4ff; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--fond); color: var(--texte); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--bord); border-radius: 12px; padding: 20px; }
h1 { font-size: 1.3rem; margin: 0 0 1rem; }
label { display: block; font-weight: 600; margin: .6rem 0 .3rem; }
input[type=password] { font: inherit; width: 100%; padding: .6rem; border: 1px solid var(--bord); border-radius: 8px; background: var(--surface); color: var(--texte); }
.case { display: flex; gap: .5rem; align-items: center; margin: .8rem 0; }
.case input { width: 20px; height: 20px; accent-color: var(--accent); }
.case label { font-weight: 400; margin: 0; }
button { font: inherit; font-weight: 600; width: 100%; min-height: 44px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-texte); cursor: pointer; }
button:disabled { opacity: .6; }
#erreur { color: var(--ko); min-height: 1.5em; margin: .6rem 0 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
</head>

<form id="verrou">
  <h1>Accès privé</h1>
  <label for="mdp">Mot de passe</label>
  <input type="password" id="mdp" autocomplete="current-password" required>
  <div class="case"><input type="checkbox" id="garder" checked><label for="garder">Se souvenir sur cet appareil</label></div>
  <button type="submit" id="ok">Ouvrir</button>
  <p id="erreur" role="alert"></p>
</form>

  var CLE_LOCALE = 'guide-social-cle';
  var subtle = window.crypto && window.crypto.subtle;
  var erreur = document.getElementById('erreur');
  var bouton = document.getElementById('ok');

  if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(location.href)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  function versOctets(b64) {
    var bin = atob(b64), o = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
    return o;
  }
  function versBase64(buf) {
    var o = new Uint8Array(buf), s = '';
    for (var i = 0; i < o.length; i++) s += String.fromCharCode(o[i]);
    return btoa(s);
  }
  function deriver(mdp) {
    return subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveBits']).then(function (base) {
      return subtle.deriveBits({ name: 'PBKDF2', salt: versOctets(CHARGE.sel), iterations: CHARGE.iterations, hash: 'SHA-256' }, base, 256);
    });
  }
  function dechiffrer(octetsCle) {
    return subtle.importKey('raw', octetsCle, 'AES-GCM', false, ['decrypt']).then(function (cle) {
      return subtle.decrypt({ name: 'AES-GCM', iv: versOctets(CHARGE.iv) }, cle, versOctets(CHARGE.donnees));
    }).then(function (clair) { return new TextDecoder().decode(clair); });
  }
  function afficher(html) {
    function remplacer() { document.open(); document.write(html); document.close(); }
    if (document.readyState === 'complete') remplacer();
    else window.addEventListener('load', function () { setTimeout(remplacer, 0); });
  }
  function oublier() { try { localStorage.removeItem(CLE_LOCALE); } catch (e) {} }
  function pret() {
    bouton.disabled = false;
    bouton.textContent = 'Ouvrir';
    document.getElementById('mdp').focus();
  }

  if (!subtle) {
    erreur.textContent = 'Ce navigateur ne sait pas déchiffrer la page. Ouvre-la en HTTPS dans Safari, Chrome, Edge ou Firefox récents.';
    bouton.disabled = true;
    return;
  }

  var memorisee = null;
  try { memorisee = localStorage.getItem(CLE_LOCALE); } catch (e) {}
  if (memorisee) {
    bouton.disabled = true;
    bouton.textContent = 'Ouverture…';
    dechiffrer(versOctets(memorisee)).then(function (html) {
      try { sessionStorage.setItem(CLE_LOCALE, memorisee); } catch (e2) {}
      afficher(html);
    }, function () { oublier(); pret(); });
  } else {
    pret();
  }

  document.getElementById('verrou').addEventListener('submit', function (e) {
    e.preventDefault();
    var mdp = document.getElementById('mdp').value;
    var garder = document.getElementById('garder').checked;
    bouton.disabled = true;
    erreur.textContent = '';
    bouton.textContent = 'Ouverture…';
    var octets;
    deriver(mdp).then(function (bits) {
      octets = bits;
      return dechiffrer(bits);
    }).then(function (html) {
      if (garder) { try { localStorage.setItem(CLE_LOCALE, versBase64(octets)); } catch (e2) {} }
      try { sessionStorage.setItem(CLE_LOCALE, versBase64(octets)); } catch (e3) {}
      afficher(html);
    }, function () {
      erreur.textContent = 'Mot de passe incorrect.';
      pret();
      document.getElementById('mdp').select();
    });
  });
